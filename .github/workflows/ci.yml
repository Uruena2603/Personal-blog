# Gate de calidad pre-merge: corre en cada PR hacia main (y como red de
# seguridad en cada push a main). El job se llama "ci" a propósito: es el
# nombre que se marca como required status check en el ruleset proteger-main.
# No consume builds de Cloudflare Pages ni requiere despliegue.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx astro check

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
